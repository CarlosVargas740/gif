<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horarios OXXO · Panel de operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Inter:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161F;
    --ink-2:#2A2D3A;
    --paper:#F5F3EE;
    --surface:#FFFFFF;
    --surface-2:#FBFAF7;
    --sidebar:#181A24;
    --sidebar-2:#22242F;
    --line:#E6E0D3;
    --line-strong:#D7CDB8;
    --muted:#8B8272;
    --muted-2:#6C6455;
    --red:#D2202C;
    --red-deep:#8F131C;
    --red-wash:#FBEAE8;
    --amber:#DE9A2E;
    --amber-wash:#FBF0DA;
    --green:#1E8A57;
    --green-wash:#E4F3EA;
    --blue:#2E5A9E;
    --blue-wash:#E8EFF9;
    --orange:#C05A1D;
    --orange-wash:#FBEADB;
    --radius:12px;
    --radius-sm:8px;
    --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(20,18,12,.06);
    --shadow-md:0 14px 34px -16px rgba(20,18,12,.28), 0 2px 8px rgba(20,18,12,.06);
    --font-display:'Sora', ui-sans-serif, system-ui, sans-serif;
    --font-body:'Inter', ui-sans-serif, system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
  }
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-.01em;}
  button{font-family:inherit;}
  .num{font-family:var(--font-display); font-variant-numeric:tabular-nums;}

  /* ---------- Layout shell ---------- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:236px; flex:0 0 236px; background:var(--sidebar); color:#fff;
    position:fixed; top:0; left:0; bottom:0; display:flex; flex-direction:column;
    padding:20px 14px; z-index:40;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px;}
  .brand-mark{
    width:36px; height:36px; border-radius:10px; background:var(--red);
    display:flex; align-items:center; justify-content:center; flex:0 0 36px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
  }
  .brand-mark svg{width:20px; height:20px;}
  .brand-text .name{font-family:var(--font-display); font-weight:700; font-size:15px; line-height:1.2;}
  .brand-text .tag{font-size:11px; color:rgba(255,255,255,.5); margin-top:1px;}

  .nav{display:flex; flex-direction:column; gap:2px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px;
    color:rgba(255,255,255,.62); font-weight:600; font-size:13.5px; cursor:pointer; border:none; background:transparent;
    text-align:left; width:100%;
  }
  .nav-item svg{width:18px; height:18px; flex:0 0 18px; opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:var(--red); color:#fff;}
  .nav-item.active svg{opacity:1;}
  .nav-badge{
    margin-left:auto; background:rgba(255,255,255,.14); color:#fff; font-size:10.5px; font-weight:700;
    padding:1px 7px; border-radius:20px; min-width:18px; text-align:center;
  }
  .nav-item.active .nav-badge{background:rgba(255,255,255,.28);}

  .sidebar-foot{border-top:1px solid rgba(255,255,255,.1); padding-top:12px; margin-top:8px;}
  .law-chip{
    display:flex; gap:8px; align-items:flex-start; font-size:11px; color:rgba(255,255,255,.48); line-height:1.5; padding:2px 8px;
  }
  .law-chip svg{width:14px; height:14px; flex:0 0 14px; margin-top:1px; opacity:.7;}

  .main-wrap{flex:1; margin-left:236px; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    position:sticky; top:0; z-index:30; background:rgba(245,243,238,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .topbar-left{display:flex; flex-direction:column; gap:1px;}
  .topbar-title{font-size:18px; font-weight:700;}
  .topbar-sub{font-size:12px; color:var(--muted);}
  .topbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  .store-input{
    background:var(--surface); border:1.5px solid var(--line); border-radius:9px; color:var(--ink); padding:8px 12px;
    font-size:13px; font-weight:600; min-width:190px; font-family:inherit;
  }
  .store-input:focus{outline:none; border-color:var(--red);}

  .icon-btn{
    position:relative; width:36px; height:36px; border-radius:9px; border:1.5px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-2);
  }
  .icon-btn:hover{border-color:var(--line-strong);}
  .icon-btn svg{width:17px; height:17px;}
  .icon-btn .ping{
    position:absolute; top:-4px; right:-4px; background:var(--red); color:#fff; font-size:10px; font-weight:800;
    min-width:16px; height:16px; border-radius:20px; display:flex; align-items:center; justify-content:center; padding:0 3px;
    border:2px solid var(--paper);
  }

  main{padding:24px 28px 60px;}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; border-radius:9px; padding:9px 15px; font-weight:700; font-size:13px;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px; font-family:inherit; white-space:nowrap;
  }
  .btn svg{width:15px; height:15px;}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:var(--red-deep);}
  .btn-dark{background:var(--ink); color:#fff;}
  .btn-dark:hover{background:var(--ink-2);}
  .btn-ghost{background:var(--surface); color:var(--ink-2); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--line-strong); background:var(--surface-2);}
  .btn-danger{background:transparent; color:#A33333; padding:6px 8px;}
  .btn-danger:hover{background:var(--red-wash);}
  .btn-sm{padding:6px 11px; font-size:12px; border-radius:7px;}
  .btn-xs{padding:5px 9px; font-size:11.5px; border-radius:7px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-block{width:100%; justify-content:center;}
  .btn-outline-rest{background:var(--surface); color:var(--muted-2); border:1.5px solid var(--line);}
  .btn-outline-rest.active{background:#EDE6D6; color:var(--ink); border-color:var(--line-strong);}

  /* ---------- Panels / cards ---------- */
  .panel{
    background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);
    padding:22px 24px; margin-bottom:18px; border:1px solid var(--line);
  }
  .panel-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .panel h2{font-size:16.5px; margin-bottom:3px;}
  .panel .hint{color:var(--muted); font-size:12.8px; margin:0; line-height:1.55; max-width:62ch;}

  label{font-size:12.3px; font-weight:600; color:var(--muted-2); display:block; margin-bottom:5px;}
  input[type=text], input[type=time], input[type=number], select{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px;
    font-size:13.3px; color:var(--ink); background:var(--surface); font-family:inherit;
  }
  input:focus, select:focus{outline:none; border-color:var(--red); box-shadow:0 0 0 3px var(--red-wash);}
  ::placeholder{color:#B4AC9C;}

  table{width:100%; border-collapse:collapse; font-size:13.3px;}
  th{text-align:left; font-size:11.3px; font-weight:700; color:var(--muted-2); padding:9px 10px; border-bottom:1.5px solid var(--line);}
  td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.3px; font-weight:700;}
  .tag-lider{background:var(--red-wash); color:var(--red-deep);}
  .tag-encargado{background:var(--amber-wash); color:#7A5300;}
  .tag-cajero{background:var(--green-wash); color:var(--green);}

  /* ---------- Notification bell ---------- */
  .notif-wrap{position:relative;}
  .notif-panel{
    position:absolute; top:44px; right:0; width:340px; max-height:420px; overflow-y:auto;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-md);
    z-index:50; padding:6px;
  }
  .notif-panel-head{display:flex; justify-content:space-between; align-items:center; padding:10px 10px 8px; border-bottom:1px solid var(--line); margin-bottom:4px;}
  .notif-panel-head h3{font-size:13.5px;}
  .notif-item{display:flex; gap:10px; align-items:flex-start; padding:9px 10px; border-radius:8px; font-size:12.6px; line-height:1.45;}
  .notif-item:hover{background:var(--surface-2);}
  .notif-icon{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex:0 0 26px;}
  .notif-icon svg{width:14px; height:14px;}
  .notif-icon.error{background:var(--red-wash); color:var(--red-deep);}
  .notif-icon.warning{background:var(--amber-wash); color:#8A5A00;}
  .notif-icon.info{background:var(--blue-wash); color:var(--blue);}
  .notif-icon.ok{background:var(--green-wash); color:var(--green);}
  .notif-empty{padding:24px 12px; text-align:center; color:var(--muted); font-size:12.6px;}
  .notif-foot{padding:8px 10px 4px; text-align:center;}
  .notif-foot button{background:none; border:none; color:var(--red); font-weight:700; font-size:12px; cursor:pointer; font-family:inherit;}

  /* ---------- KPI grid ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  .kpi-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px 20px;
    box-shadow:var(--shadow-sm);
  }
  .kpi-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;}
  .kpi-label{font-size:12.3px; font-weight:600; color:var(--muted-2);}
  .kpi-icon{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center;}
  .kpi-icon svg{width:16px; height:16px;}
  .kpi-icon.red{background:var(--red-wash); color:var(--red-deep);}
  .kpi-icon.amber{background:var(--amber-wash); color:#8A5A00;}
  .kpi-icon.green{background:var(--green-wash); color:var(--green);}
  .kpi-icon.blue{background:var(--blue-wash); color:var(--blue);}
  .kpi-value{font-size:26px; font-weight:700; line-height:1;}
  .kpi-foot{font-size:12px; color:var(--muted); margin-top:7px; line-height:1.4;}
  .kpi-foot.bad{color:#A33333; font-weight:600;}
  .kpi-foot.good{color:var(--green); font-weight:600;}

  .chart-row{display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-bottom:18px;}
  .chart-legend{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .chart-legend-item{display:flex; align-items:center; gap:8px; font-size:12.6px;}
  .chart-legend-item .sw{width:10px; height:10px; border-radius:3px; flex:0 0 10px;}
  .chart-legend-item .lbl{flex:1; color:var(--ink-2); font-weight:600;}
  .chart-legend-item .val{color:var(--muted); font-variant-numeric:tabular-nums;}
  .bars-svg text{font-family:var(--font-body); fill:var(--muted);}
  .empty-chart{color:var(--muted); font-size:12.8px; text-align:center; padding:30px 10px;}

  .alert-feed{display:flex; flex-direction:column; gap:8px;}
  .alert-row{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:10px; font-size:13px; border:1px solid var(--line);}
  .alert-row .notif-icon{margin-top:1px;}

  /* ---------- Badge tipo turno ---------- */
  .badge-tipo{
    display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px; font-weight:700; font-size:12px; width:fit-content;
  }
  .badge-diurno{background:var(--amber-wash); color:#8A5A00;}
  .badge-nocturno{background:var(--blue-wash); color:var(--blue);}
  .badge-mixto{background:var(--orange-wash); color:var(--orange);}
  .dot{width:8px;height:8px;border-radius:50%;}
  .dot-diurno{background:var(--amber);}
  .dot-nocturno{background:var(--blue);}
  .dot-mixto{background:var(--orange);}
  .legal-ok{color:var(--green); font-size:12px; font-weight:700;}
  .legal-bad{color:#A33333; font-size:12px; font-weight:700;}

  .law-box{
    background:var(--amber-wash); border:1px solid #F0DEB0; border-radius:10px; padding:15px 17px; font-size:12.6px; color:#5C4A2A; margin-top:6px; line-height:1.6;
  }
  .law-box b{color:#7A5300;}

  .turno-card{
    border:1.5px solid var(--line); border-radius:var(--radius); padding:15px 17px; margin-bottom:12px;
    display:grid; grid-template-columns: 1.2fr .8fr .8fr .8fr 1.1fr auto; gap:14px; align-items:center;
  }

  .op-row{display:flex; gap:16px; align-items:end; flex-wrap:wrap; margin-top:6px;}
  .op-field{min-width:140px;}
  .op-check{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:9px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;}
  .toolbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .search-field{position:relative; min-width:190px;}
  .search-field input{padding-left:32px;}
  .search-field svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--muted); pointer-events:none;}

  .publish-chip{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; padding:6px 12px; border-radius:20px;}
  .publish-chip svg{width:13px; height:13px;}
  .publish-chip.ok{background:var(--green-wash); color:var(--green);}
  .publish-chip.warn{background:var(--amber-wash); color:#8A5A00;}
  .publish-chip.none{background:var(--surface-2); color:var(--muted); border:1px solid var(--line);}

  .grid-wrap{overflow-x:auto; border-radius:var(--radius);}
  .sched-grid{width:100%; border-collapse:separate; border-spacing:8px;}
  .sched-grid thead th{position:sticky; top:0; z-index:3; background:var(--paper); padding:0 0 4px 4px; border:none; text-align:left;}
  .day-head{font-size:13px; font-weight:700; color:var(--red-deep); font-family:var(--font-display);}
  .colab-label{font-size:12.6px; font-weight:700; color:var(--ink); padding:9px 9px; white-space:nowrap; min-width:126px; border-radius:10px;}
  .colab-label .small{display:block; font-weight:600; color:var(--muted); font-size:11px; margin-top:2px;}
  .sched-grid td.colab-label, .sched-grid th:first-child{
    position:sticky; left:0; z-index:2; background:var(--paper);
  }
  .sched-grid thead th:first-child{ z-index:4; }

  .cell{
    background:var(--surface-2); border:1.5px solid var(--line); border-radius:10px; padding:9px; min-width:154px; vertical-align:top;
  }
  .cell.libre{border-style:dashed;}
  .cell.descanso{background:#EDE6D6; border-color:#DED0B3;}
  .cell.ilegal{background:var(--red-wash); border-color:#E7B2AE;}
  .cell.legal{background:var(--green-wash); border-color:#CBE6D6;}
  .time-row{display:flex; gap:4px; margin-bottom:7px;}
  .time-row input{padding:5px 6px; font-size:12px;}
  .cell-actions{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px;}
  .quick-select{font-size:11px; padding:4px 5px; border-radius:6px;}
  .cell-badge{font-size:11px; font-weight:700; display:flex; align-items:center; gap:4px;}
  .cell-badge svg{width:11px; height:11px;}
  .cell-badge.ok{color:var(--green);}
  .cell-badge.bad{color:#A33333;}
  .descanso-label{font-size:12px; font-weight:700; color:var(--muted-2); text-align:center; padding:10px 0; display:flex; align-items:center; justify-content:center; gap:6px;}
  .descanso-label svg{width:13px; height:13px;}

  .day-col-head{display:flex; flex-direction:column; gap:4px; min-width:154px;}
  .day-head-row{display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .day-copy-select{font-size:10.3px; padding:2px 3px; border-radius:6px; border:1.5px solid var(--line); color:var(--muted); max-width:96px;}

  .total-col{min-width:120px;}
  .total-cell{background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:10px 10px; text-align:center;}
  .total-cell .horas-num{font-weight:700; font-size:15px; color:var(--ink); font-family:var(--font-display);}
  .total-cell .horas-max{font-size:11px; color:var(--muted); margin-top:1px;}
  .total-cell .barwrap{margin-top:7px;}
  .total-cell.over .horas-num{color:#A33333;}

  .barwrap{background:#EDE6D6; border-radius:6px; height:7px; margin-top:8px; overflow:hidden;}
  .bar{height:100%; border-radius:6px; background:var(--red);}
  .bar.over{background:#A33333;}
  .small{font-size:12px; color:var(--muted);}

  .issue{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:10px; margin-bottom:8px; font-size:13.3px; line-height:1.5;}
  .issue-error{background:var(--red-wash); color:#8A2A28;}
  .issue-warning{background:var(--amber-wash); color:#7A5300;}
  .issue-info{background:var(--blue-wash); color:#274470;}
  .issue-ok{background:var(--green-wash); color:#1F6B49;}
  .issue-icon{flex:0 0 auto; margin-top:1px;}
  .issue-icon svg{width:16px; height:16px;}
  .issue-more{color:var(--muted); font-size:12.5px; padding:4px 12px;}

  .summary-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .colab-card{border:1.5px solid var(--line); border-radius:var(--radius); padding:14px 16px; background:var(--surface);}
  .colab-card .nombre{font-weight:700; font-size:14px; margin-bottom:2px;}

  .empty{color:var(--muted); font-size:13px; padding:14px 4px;}
  .empty-search{color:var(--muted); font-size:13px; padding:20px 4px; text-align:center;}
  .footer-note{text-align:center; color:var(--muted); font-size:11.8px; margin:8px 0 0; line-height:1.6;}

  .save-indicator{
    display:inline-flex; align-items:center; gap:6px; font-size:11.8px; font-weight:700; color:var(--green);
    opacity:0; transition:opacity .35s ease; white-space:nowrap;
  }
  .save-indicator.show{opacity:1;}
  .save-indicator .dot-save{width:6px; height:6px; border-radius:50%; background:var(--green);}

  .sync-badge{
    font-size:11.3px; font-weight:700; color:var(--muted-2); white-space:nowrap;
    padding:6px 12px; border-radius:20px; background:var(--surface); border:1.5px solid var(--line);
    display:inline-flex; align-items:center; gap:6px;
  }
  .sync-badge svg{width:13px; height:13px;}
  .sync-badge.show{color:var(--ink-2);}
  .sync-badge.error{background:var(--red-wash); color:#8A2A28; border-color:#E7B2AE;}

  /* ---------- Empty states ---------- */
  .zero-state{text-align:center; padding:36px 20px; color:var(--muted);}
  .zero-state svg{width:38px; height:38px; margin-bottom:10px; opacity:.5;}
  .zero-state .t{font-weight:700; color:var(--ink-2); font-size:14px; margin-bottom:4px;}
  .zero-state .d{font-size:12.6px; max-width:40ch; margin:0 auto;}

  /* ---------- Tema oscuro ---------- */
  .shell[data-theme="dark"]{
    --ink:#ECEDF3; --ink-2:#C7C9D8; --paper:#14151C; --surface:#1B1D27; --surface-2:#20222D;
    --line:#2B2E3B; --line-strong:#3A3E4E; --muted:#8890A6; --muted-2:#A3AABC;
    --red-wash:#3A2024; --amber-wash:#332A16; --green-wash:#173226; --blue-wash:#1B2A40; --orange-wash:#332417;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 14px 34px -16px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.3);
  }
  .shell[data-theme="dark"] .topbar{background:rgba(20,21,28,.88);}
  .shell[data-theme="dark"] .cell.descanso{background:#262A38; border-color:#383D50;}
  .shell[data-theme="dark"] .barwrap{background:#2B2E3B;}
  .shell[data-theme="dark"] .law-box{background:#332A16; color:#E9CE8E; border-color:#4A3D1E;}
  .shell[data-theme="dark"] .law-box b{color:#F0DEB0;}
  .shell[data-theme="dark"] .btn-outline-rest.active{background:#2E3242; color:var(--ink); border-color:var(--line-strong);}
  .shell[data-theme="dark"] .compact-libre{color:#6B7286;}

  .theme-toggle{

    remoteRef = db.ref(STORAGE_KEY);
    setSyncBadge("conectando");
    remoteRef.on("value", snap=>{
      const val = snap.val();
      firebaseReady = true;
      if(!val){ pushToFirebase(true); setSyncBadge("sincronizado"); return; }
      if(suppressNextRemote){ suppressNextRemote = false; setSyncBadge("sincronizado"); return; }
      applyRemoteState(val);
      setSyncBadge("sincronizado");
    }, err=>{
      console.error("Firebase:", err);
      setSyncBadge("error");
    });
  }catch(e){
    console.error("No se pudo inicializar Firebase:", e);
    setSyncBadge("error");
  }
}

function applyRemoteState(remote){
  const active = document.activeElement;
  const isEditing = active && ["INPUT","SELECT","TEXTAREA"].includes(active.tagName);
  if(isEditing){ pendingRemoteState = remote; return; }
  state = Object.assign(defaultState(), remote);
  state.operacion = Object.assign(defaultState().operacion, remote.operacion||{});
  state.publicacion = Object.assign(defaultState().publicacion, remote.publicacion||{});
  ensureHorarioShape();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  render();
}
document.addEventListener("focusout", ()=>{
  setTimeout(()=>{
    if(pendingRemoteState && !["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)){
      const p = pendingRemoteState; pendingRemoteState = null;
      applyRemoteState(p);
    }
  }, 60);
}, true);

function pushToFirebase(immediate){
  if(!remoteRef) return;
  clearTimeout(firebaseSaveTimeout);
  const doPush = ()=>{
    suppressNextRemote = true;
    setSyncBadge("sincronizando");
    remoteRef.set(state).then(()=> setSyncBadge("sincronizado")).catch(e=>{
      console.error("Error al sincronizar:", e);
      setSyncBadge("error");
    });
  };
  if(immediate) doPush();
  else firebaseSaveTimeout = setTimeout(doPush, 500);
}

function setSyncBadge(status){
  currentSyncStatus = status;
  const el = document.getElementById("syncBadge");

  const s = SYNC_STATUS_MAP[status] || SYNC_STATUS_MAP.local;
  el.innerHTML = `${ic(s.icon)}<span>${s.text}</span>`;

const AVATAR_COLORS = ["#D2202C","#2E5A9E","#1E8A57","#C05A1D","#7A4FBF","#B08000","#0E7C86","#A8325E"];
function avatarColor(nombre){
  let hash = 0;
  const s = String(nombre||"?");
  for(let i=0;i<s.length;i++){ hash = s.charCodeAt(i) + ((hash<<5)-hash); }
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function initials(nombre){
  const parts = String(nombre||"").trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return "?";
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[1][0]).toUpperCase();
}
function avatarHtml(nombre){
  return `<span class="avatar" style="background:${avatarColor(nombre)}">${initials(nombre)}</span>`;
}

/* =========================================================
   NÚMEROS QUE "CUENTAN" AL CARGAR EL PANEL
========================================================= */
function formatKpiValue(fmt, value){
  if(fmt==="money") return value>0.5 ? '$'+Math.round(value).toLocaleString('es-MX') : '—';
  if(fmt==="hours") return value.toFixed(1)+" h";
  if(fmt==="pct") return value.toFixed(0)+"%";
  if(fmt==="int") return String(Math.round(value));
  return String(Math.round(value));
}
function animateCountUp(el){
  const target = parseFloat(el.dataset.count);
  const fmt = el.dataset.fmt;
  if(!isFinite(target)) return;
  const duration = 900;
  const t0 = performance.now();
  function step(now){
    const t = Math.min(1, (now-t0)/duration);
    const eased = 1-Math.pow(1-t, 3);
    el.textContent = formatKpiValue(fmt, target*eased);
    if(t<1) requestAnimationFrame(step);
    else el.textContent = formatKpiValue(fmt, target);
  }
  requestAnimationFrame(step);
}
function animateDashboardEntrance(){
  document.querySelectorAll(".kpi-value[data-count]").forEach(el=> animateCountUp(el));
  document.querySelectorAll(".bars-svg rect.cov-bar").forEach(rect=>{
    const targetH = rect.getAttribute("height");
    const targetY = rect.getAttribute("y");
    const base = rect.dataset.base;
    // colapsa la barra a 0 y fuerza reflow antes de animar hacia su valor real
    rect.style.transition = "none";
    rect.setAttribute("height", "0");
    rect.setAttribute("y", base);
    void rect.getBBox();
    requestAnimationFrame(()=>{
      rect.style.transition = "";
      requestAnimationFrame(()=>{
        rect.setAttribute("height", targetH);
        rect.setAttribute("y", targetY);
      });
    });
  });
}

/* =========================================================
   REGLAS LFT: diurno / nocturno / mixto
========================================================= */
function toMin(hhmm){ const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
function minToHHMM(min){
  min = ((Math.round(min)%1440)+1440)%1440;
  const h=Math.floor(min/60), m=min%60;
  return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0');
}

function calcTurno(inicio, fin){
  let start = toMin(inicio);
  let end = toMin(fin);
  if(end <= start) end += 24*60;
  const totalMin = end - start;
  let nightMin = 0;
  const step = 15;
  for(let t=start; t<end; t+=step){
    const m = t % (24*60);
    const esNoche = (m >= 20*60) || (m < 6*60);
    if(esNoche) nightMin += step;
  }
  nightMin = Math.min(nightMin, totalMin);
  const dayMin = totalMin - nightMin;
  const horas = totalMin/60;

  let tipo, maxLegal;
  if(nightMin === 0){ tipo = "Diurno"; maxLegal = 8; }
  else if(dayMin === 0){ tipo = "Nocturno"; maxLegal = 7; }
  else if(nightMin < 3.5*60){ tipo = "Mixto"; maxLegal = 7.5; }
  else { tipo = "Nocturno"; maxLegal = 7; }

  return { horas, tipo, nightHoras: nightMin/60, dayHoras: dayMin/60, maxLegal, esLegal: horas <= maxLegal + 0.001 };
}

function calcTotalColab(cid){
  let total = 0, dias = 0;
  for(let d=0; d<7; d++){
    const e = (state.horario[d]||{})[cid];
    if(e && e.estado==="trabaja" && e.inicio && e.fin){
      total += calcTurno(e.inicio, e.fin).horas;
      dias++;
    }
  }
  return { total, dias };
}

/* =========================================================
   ORGANIZADOR AUTOMÁTICO (usa las plantillas de turno como base,
   pero cada asignación queda como horario propio editable)
========================================================= */
function autoOrganizar(){
  ensureHorarioShape();
  const hoursAssigned = {}; const daysWorked = {};
  state.colaboradores.forEach(c=>{ hoursAssigned[c.id]=0; daysWorked[c.id]=0; });

  for(let d=0; d<7; d++){ state.horario[d] = {}; }

  for(let d=0; d<7; d++){
    const asignadosHoy = new Set();
    const turnosOrden = [...state.turnos];
    if(d % 2 === 1) turnosOrden.reverse();

    turnosOrden.forEach(t=>{
      const info = calcTurno(t.inicio, t.fin);
      let candidatos = state.colaboradores.filter(c=>{
        const maxC = c.maxHoras || state.maxHorasSemana;
        return !asignadosHoy.has(c.id) &&
               (hoursAssigned[c.id] + info.horas) <= maxC + 0.001 &&
               daysWorked[c.id] < 6;
      });
      candidatos.sort((a,b)=> hoursAssigned[a.id]-hoursAssigned[b.id]);

      const seleccion = [];
      const conMando = candidatos.find(c=>c.puesto !== "Cajero/Auxiliar");
      if(conMando) seleccion.push(conMando);
      for(const c of candidatos){
        if(seleccion.length >= t.minPersonal) break;
        if(!seleccion.find(s=>s.id===c.id)) seleccion.push(c);
      }
      const final = seleccion.slice(0, t.minPersonal);
      final.forEach(c=>{
        state.horario[d][c.id] = { estado:"trabaja", inicio:t.inicio, fin:t.fin };
        asignadosHoy.add(c.id);
        hoursAssigned[c.id] += info.horas;
        daysWorked[c.id] += 1;
      });
    });
  }

  // marca explícitamente como descanso cualquier día sin asignación
  for(let d=0; d<7; d++){
    state.colaboradores.forEach(c=>{
      if(!state.horario[d][c.id]) state.horario[d][c.id] = { estado:"descanso" };
    });
  }

  saveState();
  render();
}

/* =========================================================
   COBERTURA: cuántas personas hay en tienda en cada minuto
========================================================= */
function buildCoverage(){
  const coverage = Array.from({length:7}, ()=> new Array(1440).fill(0));
  for(let d=0; d<7; d++){
    state.colaboradores.forEach(c=>{
      const entry = (state.horario[d]||{})[c.id];
      if(!entry || entry.estado!=="trabaja" || !entry.inicio || !entry.fin) return;
      let start = toMin(entry.inicio), end = toMin(entry.fin);
      if(end<=start) end += 1440;
      const localEnd = Math.min(end,1440);
      for(let m=start; m<localEnd; m++) coverage[d][m]++;
      if(end>1440 && d+1<7){
        const overflow = end-1440;
        for(let m=0; m<overflow; m++) coverage[d+1][m]++;
      }
    });
  }
  return coverage;
}

function operatingWindow(){
  if(state.operacion.is24h) return {open:0, close:1440};
  let open = toMin(state.operacion.apertura);
  let close = toMin(state.operacion.cierre);
  if(close<=open) close += 1440;
  return {open, close};
}

/* =========================================================
   MÉTRICAS DE PANEL (dashboard pro): costo de nómina,
   cobertura %, huecos, horas por puesto, cobertura por hora
========================================================= */
function buildDashboardMetrics(){
  ensureHorarioShape();
  const coverage = buildCoverage();
  const {open, close} = operatingWindow();

  let minutosOperacion = 0, minutosCubiertos = 0, huecos = 0, minutosDescubiertos = 0;
  const scanCoverage = (dayIdx, arr, startMin, endMin)=>{
    let i = Math.max(0,startMin);
    const end = Math.min(1440,endMin);
    while(i<end){
      const cnt = arr[i];
      let j = i;
      while(j<end && arr[j]===cnt) j++;
      const dur = j-i;
      minutosOperacion += dur;
      if(cnt>0) minutosCubiertos += dur;
      else if(dur>=15){ huecos++; minutosDescubiertos += dur; }
      i = j;
    }
  };
  for(let d=0; d<7; d++){
    scanCoverage(d, coverage[d], open, Math.min(close,1440));
    if(close>1440 && d+1<7) scanCoverage(d+1, coverage[d+1], 0, close-1440);
  }
  const coberturaPct = minutosOperacion>0 ? (minutosCubiertos/minutosOperacion)*100 : 100;

  // cobertura promedio por hora del día (0-23), a través de los 7 días
  const coberturaPorHora = new Array(24).fill(0);
  for(let h=0; h<24; h++){
    let suma = 0;
    for(let d=0; d<7; d++){
      for(let m=h*60; m<h*60+60; m+=10) suma += coverage[d][m];
    }
    coberturaPorHora[h] = suma / (7*6); // promedio de personas presentes
  }

  // horas y costo por puesto
  const horasPorPuesto = {}; PUESTOS.forEach(p=> horasPorPuesto[p]=0);
  let costoNomina = 0, horasProgramadas = 0;
  state.colaboradores.forEach(c=>{
    const { total } = calcTotalColab(c.id);
    horasProgramadas += total;
    horasPorPuesto[c.puesto] = (horasPorPuesto[c.puesto]||0) + total;
    costoNomina += total * (c.sueldoHora||0);
  });

  const capacidadMaxima = state.colaboradores.reduce((s,c)=> s + (c.maxHoras||state.maxHorasSemana), 0);

  return { coberturaPct, huecos, minutosDescubiertos, coberturaPorHora, horasPorPuesto, costoNomina, horasProgramadas, capacidadMaxima };
}

/* =========================================================
   VALIDACIÓN
========================================================= */
function validar(){
  const issues = [];
  ensureHorarioShape();

  // 1) Huecos y "solo" en cobertura de horas reales
  const coverage = buildCoverage();
  const {open, close} = operatingWindow();
  for(let d=0; d<7; d++){
    const segEndDay1 = Math.min(close,1440);
    scanSegment(d, coverage[d], open, segEndDay1, issues);
    if(close>1440 && d+1<7){
      scanSegment(d+1, coverage[d+1], 0, close-1440, issues);
    }
  }

  // 2) Legalidad de cada asignación puntual
  for(let d=0; d<7; d++){
    state.colaboradores.forEach(c=>{
      const e = (state.horario[d]||{})[c.id];
      if(e && e.estado==="trabaja" && e.inicio && e.fin){
        const info = calcTurno(e.inicio,e.fin);
        if(!info.esLegal){
          issues.push({tipo:"error", msg:`${c.nombre} — ${DIAS[d]} (${e.inicio}–${e.fin}): ${info.horas.toFixed(1)} h de jornada ${info.tipo.toLowerCase()}, supera el máximo legal de ${info.maxLegal} h.`});
        }
      }
    });
  }

  // 3) Horas semanales y descanso por colaborador
  state.colaboradores.forEach(c=>{
    let totalHoras = 0, diasTrabajados = 0, tieneDescansoExplicito = false;
    for(let d=0; d<7; d++){
      const e = (state.horario[d]||{})[c.id];
      if(e && e.estado==="trabaja" && e.inicio && e.fin){
        totalHoras += calcTurno(e.inicio,e.fin).horas;
        diasTrabajados++;
      } else if(e && e.estado==="descanso"){
        tieneDescansoExplicito = true;
      }
    }
    const maxC = c.maxHoras || state.maxHorasSemana;
    if(totalHoras > maxC + 0.001){
      issues.push({tipo:"error", msg:`${c.nombre}: ${totalHoras.toFixed(1)} h en la semana, excede su máximo de ${maxC} h.`});
    }
    if(diasTrabajados >= 7){
      issues.push({tipo:"error", msg:`${c.nombre}: trabaja los 7 días, sin día de descanso (obligatorio al menos 1 cada 6 días).`});
    } else if(!tieneDescansoExplicito){
      issues.push({tipo:"info", msg:`${c.nombre}: no tiene ningún día marcado explícitamente como "Descanso" — márcalo para que quede claro en el horario.`});
    }
  });

  // 4) Presencia de mando (Líder/Encargado) por día
  for(let d=0; d<7; d++){
    const trabajanHoy = state.colaboradores.filter(c=>{
      const e = (state.horario[d]||{})[c.id];
      return e && e.estado==="trabaja";
    });
    if(trabajanHoy.length>0 && !trabajanHoy.some(c=>c.puesto!=="Cajero/Auxiliar")){
      issues.push({tipo:"info", msg:`${DIAS[d]}: nadie con puesto de Líder o Encargado de Turno está trabajando ese día.`});
    }
  }

  // 5) Plantillas de turno con jornada ilegal (referencia)
  state.turnos.forEach(t=>{
    const info = calcTurno(t.inicio,t.fin);
    if(!info.esLegal){
      issues.push({tipo:"warning", msg:`Plantilla "${t.nombre}" (${t.inicio}–${t.fin}) dura ${info.horas.toFixed(1)} h, supera el máximo legal de ${info.maxLegal} h para jornada ${info.tipo.toLowerCase()}.`});
    }
  });

  // 6) Estado de publicación
  const pub = state.publicacion || {publicado:false};
  const horarioActual = JSON.stringify(state.horario);
  if(!pub.publicado){
    issues.push({tipo:"info", msg:`El horario de esta semana aún no se ha publicado. Usa "Publicar horario" en la pestaña Horario semanal cuando esté listo para el equipo.`});
  } else if(pub.snapshot !== horarioActual){
    issues.push({tipo:"warning", msg:`Hay cambios en el horario desde la última publicación (${formatFecha(pub.fecha)}). Vuelve a publicar para que el equipo vea la versión más reciente.`});
  }

  const errores = issues.filter(i=>i.tipo==="error");
  const advertencias = issues.filter(i=>i.tipo==="warning");
  const info = issues.filter(i=>i.tipo==="info");
  const ordenado = [...errores, ...advertencias, ...info];

  if(ordenado.length === 0){
    ordenado.push({tipo:"ok", msg:"Todo en orden: cobertura completa, nadie solo, jornadas legales y descansos definidos."});
  }
  return ordenado;
}

function scanSegment(dayIdx, coverageArr, startMin, endMin, issues){
  let i = Math.max(0,startMin);
  const end = Math.min(1440,endMin);
  let count = 0;
  while(i<end){
    const cnt = coverageArr[i];
    let j = i;
    while(j<end && coverageArr[j]===cnt) j++;
    const dur = j-i;
    if(dur>=15 && count<6){
      if(cnt===0){
        issues.push({tipo:"error", msg:`${DIAS[dayIdx]} ${minToHHMM(i)}–${minToHHMM(j)}: sin nadie en tienda (turno descubierto).`});
        count++;
      } else if(cnt===1){
        issues.push({tipo:"warning", msg:`${DIAS[dayIdx]} ${minToHHMM(i)}–${minToHHMM(j)}: solo una persona en tienda.`});
        count++;
      }
    }
    i = j;
  }
}

function formatFecha(iso){
  if(!iso) return "sin fecha";
  try{
    const d = new Date(iso);
    return d.toLocaleDateString("es-MX",{day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
  }catch(e){ return "sin fecha"; }
}

function publicarHorario(){
  ensureHorarioShape();
  const prev = state.publicacion;
  if(prev && prev.publicado && prev.snapshot){
    state.historialPublicaciones = state.historialPublicaciones || [];
    state.historialPublicaciones.unshift({ fecha: prev.fecha, snapshot: prev.snapshot });
    state.historialPublicaciones = state.historialPublicaciones.slice(0, 12);
  }
  state.publicacion = { publicado:true, fecha: new Date().toISOString(), snapshot: JSON.stringify(state.horario) };
  saveState();
  render();
  mostrarConfirmacionPublicacion();
  showToast("Horario publicado", "ok", "check");

/* =========================================================
   RENDER
========================================================= */
function getActiveSelector(){
  const el = document.activeElement;
  if(!el || el === document.body || !el.tagName) return null;
  const tag = el.tagName.toLowerCase();
  if(tag!=="input" && tag!=="select" && tag!=="button" && tag!=="textarea") return null;
  const cls = el.className ? "."+String(el.className).trim().split(/\s+/).join(".") : "";
  const dataAttrs = Array.from(el.attributes).filter(a=>a.name.startsWith("data-"));
  const dataSel = dataAttrs.map(a=>`[${a.name}="${(a.value||"").replace(/"/g,'\\"')}"]`).join("");
  const idSel = el.id ? `#${el.id}` : "";
  if(!idSel && !dataSel) return null;
  return `${idSel}${tag}${cls}${dataSel}`;
}

let lastActiveTab = null;
function render(){
  const scrollY = window.scrollY;
  const scrollX = window.scrollX;
  const gridWrapBefore = document.querySelector(".grid-wrap");
  const gridScrollLeft = gridWrapBefore ? gridWrapBefore.scrollLeft : 0;
  const gridScrollTop = gridWrapBefore ? gridWrapBefore.scrollTop : 0;
  const activeSelector = getActiveSelector();
  const activeEl = document.activeElement;
  const selStart = activeEl && "selectionStart" in activeEl ? activeEl.selectionStart : null;
  const selEnd = activeEl && "selectionEnd" in activeEl ? activeEl.selectionEnd : null;

  const tabChanged = lastActiveTab !== state.activeTab;
  const enteringDashboard = tabChanged && state.activeTab === "dashboard";
  lastActiveTab = state.activeTab;

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="shell" data-theme="${state.theme==='dark' ? 'dark' : 'light'}">
      ${renderSidebar()}
      <div class="main-wrap">
        ${renderTopbar()}
        <main><div class="${tabChanged ? 'tab-anim' : ''}" id="tabContent">${renderTab()}</div></main>
        <p class="footer-note">Basado en la Ley Federal del Trabajo (MX) — jornada diurna 6:00–20:00 (máx. 8h), nocturna 20:00–6:00 (máx. 7h), mixta (máx. 7.5h, con menos de 3.5h en horario nocturno). Verifica siempre las políticas internas de OXXO/FEMSA vigentes.</p>
      </div>
    </div>
    ${renderPrintArea()}
    <div class="toast-stack" id="toastStack"></div>
  `;
  wireEvents();
  renderToastStack();

  if(enteringDashboard) animateDashboardEntrance();

  requestAnimationFrame(()=>{
    window.scrollTo(scrollX, scrollY);
    const gridWrapAfter = document.querySelector(".grid-wrap");
    if(gridWrapAfter){
      gridWrapAfter.scrollLeft = gridScrollLeft;
      gridWrapAfter.scrollTop = gridScrollTop;
    }
    if(activeSelector){
      try{
        const newEl = document.querySelector(activeSelector);
        if(newEl){
          newEl.focus({preventScroll:true});
          if(selStart!=null && newEl.setSelectionRange){
            try{ newEl.setSelectionRange(selStart, selEnd); }catch(e){}
          }
        }
      }catch(e){ /* selector inválido, ignora */ }
    }
    window.scrollTo(scrollX, scrollY);
  });
}

function renderCoberturaBarChart(values){
  const w=640, h=190, padL=6, padR=6, padT=14, padB=26;
  const usableW = w-padL-padR, usableH = h-padT-padB;
  const maxV = Math.max(2, ...values);
  const bw = usableW/values.length;
  const baseY = padT+usableH;

  const umbralY = baseY - (1/maxV)*usableH;

  const bars = values.map((v,i)=>{
    const bh = Math.max(1.5, (v/maxV)*usableH);
    const x = padL + i*bw + bw*0.16;
    const y = baseY - bh;
    const bwidth = bw*0.68;
    const risky = v < 1;
    const color = risky ? "var(--red)" : "var(--ink-2)";
    return `<rect class="cov-bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwidth.toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${color}" data-base="${baseY.toFixed(1)}"><title>${String(i).padStart(2,'0')}:00 h — ${v.toFixed(1)} persona(s) en promedio</title></rect>`;
  }).join("");

  const ticks = [0,3,6,9,12,15,18,21].map(hr=>{
    const x = padL + hr*bw + bw/2;
    return `<text x="${x.toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10.5">${String(hr).padStart(2,'0')}h</text>`;
  }).join("");

  return `<svg class="bars-svg" viewBox="0 0 ${w} ${h}" width="100%" height="190" preserveAspectRatio="none">
    <line x1="${padL}" y1="${umbralY.toFixed(1)}" x2="${w-padR}" y2="${umbralY.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="${padL}" y1="${baseY}" x2="${w-padR}" y2="${baseY}" stroke="var(--line)" stroke-width="1.2"/>
    ${bars}
    ${ticks}
  </svg>`;
}

function svgDonut(segments){
  const size=168, cx=size/2, cy=size/2, r=60, sw=24;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const circ = 2*Math.PI*r;
  let acc = 0;
  const circles = segments.filter(s=>s.value>0).map(seg=>{
    const frac = seg.value/total;
    const dash = Math.max(0, frac*circ - 1.5);
    const gap = circ-dash;
    const rotate = (acc/total)*360 - 90;
    acc += seg.value;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}" stroke-linecap="round" transform="rotate(${rotate.toFixed(1)} ${cx} ${cy})"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    ${circles}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" style="font-family:var(--font-display); font-weight:700; font-size:19px; fill:var(--ink);">${total.toFixed(0)}h</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" style="font-size:10px; fill:var(--muted);">programadas</text>
  </svg>`;
}

        return `<td><div class="cell descanso">
          <div class="descanso-label">${ic('moon')}Descanso</div>
          <div class="cell-actions">
            <button class="btn btn-xs btn-ghost" data-set-trabaja="${key}">Poner horario</button>
          </div>
        </div></td>`;
      }

      if(entry && entry.estado==="trabaja"){
        const info = calcTurno(entry.inicio, entry.fin);
        const legalClass = info.esLegal ? "legal" : "ilegal";
        return `<td><div class="cell ${legalClass}">
          <div class="time-row">
            <input type="time" class="cell-inicio" data-key="${key}" value="${entry.inicio}">
            <input type="time" class="cell-fin" data-key="${key}" value="${entry.fin}">
          </div>
          <div class="cell-badge ${info.esLegal?'ok':'bad'}">${ic(info.esLegal?'check':'alertTriangle')}${info.tipo} · ${info.horas.toFixed(1)}h ${info.esLegal?'':'· máx '+info.maxLegal+'h'}</div>
          <div class="cell-actions" style="margin-top:6px">
            <select class="quick-select" data-quick="${key}"><option value="">plantilla…</option>${quickOptions}</select>
            <button class="btn btn-xs btn-outline-rest" data-set-descanso="${key}">Descanso</button>
          </div>
        </div></td>`;
      }

      return `<td><div class="cell libre">
        <div class="small" style="margin-bottom:6px">Sin asignar</div>
        <div class="cell-actions">
          <select class="quick-select" data-quick="${key}"><option value="">plantilla…</option>${quickOptions}</select>
        </div>
        <div class="cell-actions" style="margin-top:6px">
          <button class="btn btn-xs btn-ghost" data-set-trabaja="${key}">Poner horario</button>
          <button class="btn btn-xs btn-outline-rest" data-set-descanso="${key}">Descanso</button>
        </div>
      </div></td>`;
    }).join("");

    const { total, dias } = calcTotalColab(c.id);
    const maxC = c.maxHoras || state.maxHorasSemana;
    const over = total > maxC + 0.001;
    const pct = Math.min(100, (total/maxC)*100);

    return `<tr>
      <td class="colab-label">
        <div class="colab-label-inner">
          ${avatarHtml(c.nombre)}
          <div class="colab-label-text">
            <span>${escapeHtml(c.nombre)}</span>
            <span class="tag ${puestoClass}" style="margin-top:4px; width:fit-content">${c.puesto}</span>
          </div>
        </div>
      </td>
      ${cells}
      <td class="total-col">
        <div class="total-cell ${over?'over':''}">
          <div class="horas-num num">${total.toFixed(1)} h</div>
          <div class="horas-max">de ${maxC} h · ${dias} día(s)</div>
          <div class="barwrap"><div class="bar ${over?'over':''}" style="width:${pct}%"></div></div>
        </div>
      </td>
    </tr>`;
  }).join("");

  const sinResultados = filtro && colabsVisibles.length===0;

  const pub = state.publicacion || {publicado:false};
  const horarioActual = JSON.stringify(state.horario);
  const modificado = pub.publicado && pub.snapshot !== horarioActual;
  let pubChip;
  if(!pub.publicado) pubChip = `<span class="publish-chip none">${ic('info')}Sin publicar</span>`;
  else if(modificado) pubChip = `<span class="publish-chip warn">${ic('alertTriangle')}Cambios sin publicar</span>`;
  else pubChip = `<span class="publish-chip ok">${ic('check')}Publicado ${formatFecha(pub.fecha)}</span>`;

  return `
  <div class="panel">
    <div class="toolbar">
      <div>
        <h2 style="margin-bottom:2px">Horario semanal</h2>
        <p class="hint" style="margin-bottom:8px">Pon la hora de entrada y salida exacta de cada colaborador cada día — no tienen que coincidir con Matutino/Vespertino/Nocturno. La app clasifica el tipo de jornada y valida el máximo legal al instante. Usa "Descanso" para marcar sus días libres.</p>
        ${pubChip}
      </div>
      <div class="toolbar-actions">
        <div class="view-toggle">
          <button data-view="tarjetas" class="${state.vistaHorario!=='compacta'?'active':''}">Tarjetas</button>
          <button data-view="compacta" class="${state.vistaHorario==='compacta'?'active':''}">Compacta</button>
        </div>
        <div class="search-field">
          ${ic('search')}
          <input type="text" id="filtroColabInput" placeholder="Buscar colaborador…" value="${escapeHtml(state.filtroColab)}">
        </div>
        <div style="min-width:170px">
          <label>Semana (para imprimir)</label>
          <input type="text" id="semanaLabelInput" placeholder="Ej. 18–24 ago 2026" value="${escapeHtml(state.semanaLabel)}">
        </div>
        <button class="btn btn-ghost" id="deshacerBtn" ${undoStack.length===0?'disabled':''}>${ic('undo')}Deshacer</button>
        <button class="btn btn-ghost" id="exportarCsv">${ic('download')}CSV</button>
        <button class="btn btn-ghost" id="clearHorario">${ic('eraser')}Vaciar</button>
        <button class="btn btn-ghost" id="imprimirHorario">${ic('printer')}Imprimir / PDF</button>
        <button class="btn btn-ghost" id="guardarPlantillaSemana" title="Guarda el horario actual como plantilla recurrente">${ic('sparkle')}Guardar plantilla<span class="pro-badge">PRO</span></button>
        <button class="btn btn-ghost" id="aplicarPlantillaSemana" ${!state.plantillaSemana?'disabled':''} title="Aplica la plantilla semanal guardada">${ic('zap')}Aplicar plantilla<span class="pro-badge">PRO</span></button>
        <button class="btn btn-dark" id="publicarBtn">${ic('check')}Publicar horario</button>
        <button class="btn btn-primary" id="autoOrganizar">${ic('zap')}Organizar automáticamente</button>
      </div>
    </div>
    ${state.vistaHorario==='compacta'
      ? renderHorarioCompacta(colabsVisibles, sinResultados)
      : `<div class="grid-wrap">
      <table class="sched-grid">
        <thead>${headRow}</thead>
        <tbody>${
          sinResultados
            ? `<tr><td colspan="9" class="empty-search">Ningún colaborador coincide con "${escapeHtml(state.filtroColab)}".</td></tr>`
            : (rows || `<tr><td colspan="9" class="empty">Agrega colaboradores primero.</td></tr>`)
        }</tbody>
      </table>
    </div>`}
  </div>
  ${renderHistorialPublicaciones()}`;
}

/* ---------------- Horario semanal: vista compacta ---------------- */
function compactCell(d, c){
  const entry = (state.horario[d] && state.horario[d][c.id]) || null;
  const key = d+"|"+c.id;
  if(entry && entry.estado==="descanso"){
    return `<td><div class="compact-cell">
      <span class="compact-descanso">${ic('moon')}Desc.</span>
      <button class="btn btn-xs btn-ghost" data-set-trabaja="${key}" title="Poner horario">${ic('plus')}</button>
    </div></td>`;
  }
  if(entry && entry.estado==="trabaja"){
    const info = calcTurno(entry.inicio, entry.fin);
    return `<td><div class="compact-cell">
      <input type="time" class="cell-inicio" data-key="${key}" value="${entry.inicio}">
      <span class="sep">–</span>
      <input type="time" class="cell-fin" data-key="${key}" value="${entry.fin}">
      <span class="cell-badge ${info.esLegal?'ok':'bad'}" title="${info.tipo} · ${info.horas.toFixed(1)}h">${ic(info.esLegal?'check':'alertTriangle')}</span>
      <button class="btn btn-xs btn-outline-rest" data-set-descanso="${key}" title="Marcar descanso">${ic('moon')}</button>
    </div></td>`;
  }
  return `<td><div class="compact-cell compact-libre">
    <span>Sin asignar</span>
    <button class="btn btn-xs btn-ghost" data-set-trabaja="${key}" title="Poner horario">${ic('plus')}</button>
    <button class="btn btn-xs btn-outline-rest" data-set-descanso="${key}" title="Marcar descanso">${ic('moon')}</button>
  </div></td>`;
}

function renderHorarioCompacta(colabsVisibles, sinResultados){
  const headRow = `<tr><th>Colaborador</th>${DIAS_CORTO.map(d=>`<th>${d}</th>`).join("")}<th>Total</th></tr>`;
  const rows = colabsVisibles.map(c=>{
    const cells = DIAS.map((_,d)=> compactCell(d,c)).join("");
    const { total } = calcTotalColab(c.id);
    const maxC = c.maxHoras || state.maxHorasSemana;
    const over = total > maxC + 0.001;
    return `<tr>
      <td class="colab-label"><div class="colab-label-inner">${avatarHtml(c.nombre)}<span>${escapeHtml(c.nombre)}</span></div></td>
      ${cells}
      <td class="compact-total ${over?'over':''}">${total.toFixed(1)} h</td>
    </tr>`;
  }).join("");
  return `<div class="grid-wrap"><table class="compact-grid">
    <thead>${headRow}</thead>
    <tbody>${
      sinResultados
        ? `<tr><td colspan="9" class="empty-search">Ningún colaborador coincide con "${escapeHtml(state.filtroColab)}".</td></tr>`
        : (rows || `<tr><td colspan="9" class="empty">Agrega colaboradores primero.</td></tr>`)
    }</tbody>
  </table></div>`;
}

/* ---------------- Historial de publicaciones (PRO) ---------------- */
function renderHistorialPublicaciones(){
  const hist = state.historialPublicaciones || [];
  if(hist.length===0){
    return `<div class="panel">
      <div class="panel-head"><div><h2>Historial de publicaciones<span class="pro-badge">PRO</span></h2><p class="hint">Aquí se guardarán las versiones anteriores del horario publicado, no solo la última.</p></div></div>
      <p class="empty">Aún no hay versiones anteriores. Se guardará una automáticamente cada vez que publiques un nuevo horario.</p>
    </div>`;
  }
  const items = hist.map((h,i)=>`
    <div class="history-item">
      <div class="meta">Versión publicada<span class="small">${formatFecha(h.fecha)}</span></div>
      <button class="btn btn-ghost btn-sm" data-restore-pub="${i}">${ic('undo')}Restaurar</button>
    </div>`).join("");
  return `<div class="panel">
    <div class="panel-head"><div><h2>Historial de publicaciones<span class="pro-badge">PRO</span></h2><p class="hint">Versiones anteriores del horario publicado. Restaurar reemplaza el horario actual (puedes deshacer después con "Deshacer").</p></div></div>
    <div class="history-list">${items}</div>
  </div>`;
}

/* ---------------- Validación ---------------- */
function renderResumen(){
  const issues = validar();
  const MAX_SHOW = 40;
  const mostrar = issues.slice(0, MAX_SHOW);
  const iconFor = t=> t==="error"?"alertCircle":t==="warning"?"alertTriangle":t==="info"?"info":"checkCircle";
  const issuesHtml = mostrar.map(i=>`
    <div class="issue issue-${i.tipo}"><span class="issue-icon">${ic(iconFor(i.tipo))}</span><span>${i.msg}</span></div>
  `).join("") + (issues.length>MAX_SHOW ? `<div class="issue-more">y ${issues.length-MAX_SHOW} observación(es) más…</div>` : "");

  const maxSemana = state.maxHorasSemana;
  const cards = state.colaboradores.map(c=>{
    let total = 0, dias=0;
    for(let d=0; d<7; d++){
      const e = (state.horario[d]||{})[c.id];
      if(e && e.estado==="trabaja" && e.inicio && e.fin){ total += calcTurno(e.inicio,e.fin).horas; dias++; }
    }
    const maxC = c.maxHoras || maxSemana;
    const pct = Math.min(100, (total/maxC)*100);
    const over = total > maxC + 0.001;
    const puestoClass = c.puesto==="Líder de Tienda"?"tag-lider":c.puesto==="Encargado de Turno"?"tag-encargado":"tag-cajero";
    return `
    <div class="colab-card">
      <div class="nombre">${escapeHtml(c.nombre)}</div>
      <span class="tag ${puestoClass}">${c.puesto}</span>
      <div class="small" style="margin-top:8px">${total.toFixed(1)} h de ${maxC} h · ${dias} día(s) trabajados</div>
      <div class="barwrap"><div class="bar ${over?'over':''}" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");

  return `
  <div class="panel">
    <div class="panel-head"><div><h2>Validación del horario</h2><p class="hint">Con base en las horas exactas que capturaste: cobertura real minuto a minuto, colaboradores solos, jornadas fuera de la ley y descansos.</p></div></div>
    ${issuesHtml}
  </div>
  <div class="panel">
    <div class="panel-head"><div><h2>Horas por colaborador</h2><p class="hint">Carga semanal de cada persona frente a su máximo permitido.</p></div></div>
    <div class="summary-grid">${cards || `<p class="empty">No hay colaboradores registrados.</p>`}</div>
  </div>`;
}

/* ---------------- Exportar CSV ---------------- */
function csvField(v){
  const s = String(v ?? "");
  return /[",\n;]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
function exportarHorarioCSV(){
  const header = ["Colaborador","Puesto", ...DIAS, "Total horas"];
  const lines = [header.map(csvField).join(",")];
  state.colaboradores.forEach(c=>{
    const dayVals = DIAS.map((_,d)=>{
      const e = (state.horario[d]||{})[c.id];
      if(e && e.estado==="trabaja" && e.inicio && e.fin) return `${e.inicio}-${e.fin}`;
      if(e && e.estado==="descanso") return "Descanso";
      return "";
    });
    const { total } = calcTotalColab(c.id);
    lines.push([c.nombre, c.puesto, ...dayVals, total.toFixed(1)].map(csvField).join(","));
  });
  const csv = "\uFEFF" + lines.join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const nombreArchivo = (state.tienda||"horario").replace(/[^a-z0-9\-_ ]/gi,"").trim().replace(/\s+/g,"_") || "horario";
  a.href = url;
  a.download = `${nombreArchivo}_horario.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* =========================================================
   EVENTOS
========================================================= */
// Cierra el panel de notificaciones al hacer clic fuera de él (listener único, fuera de wireEvents)
document.addEventListener("click", (e)=>{
  if(notifOpen && !e.target.closest(".notif-wrap")){
    notifOpen = false;
    render();
  }
});

function wireEvents(){
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.activeTab = btn.dataset.tab; render(); });
  });

  const tiendaInput = document.getElementById("tiendaInput");
  if(tiendaInput) tiendaInput.addEventListener("change", e=>{ state.tienda = e.target.value; saveState(); });

  const themeToggle = document.getElementById("themeToggle");
  if(themeToggle){
    themeToggle.addEventListener("click", ()=>{
      state.theme = state.theme==="dark" ? "light" : "dark";
      saveState(); render();
    });
  }

  document.querySelectorAll("[data-view]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.vistaHorario = btn.dataset.view;
      saveState(); render();
    });
  });

  const guardarPlantillaSemana = document.getElementById("guardarPlantillaSemana");
  if(guardarPlantillaSemana){
    guardarPlantillaSemana.addEventListener("click", ()=>{
      if(!window.confirm("¿Guardar el horario actual como plantilla semanal? Podrás aplicarla con un clic en semanas futuras.")) return;
      state.plantillaSemana = JSON.parse(JSON.stringify(state.horario));
      saveState(); render();
      showToast("Plantilla semanal guardada", "ok", "sparkle");
    });
  }
  const aplicarPlantillaSemana = document.getElementById("aplicarPlantillaSemana");
  if(aplicarPlantillaSemana){
    aplicarPlantillaSemana.addEventListener("click", ()=>{
      if(!state.plantillaSemana) return;
      if(!window.confirm("¿Aplicar la plantilla semanal guardada? Se sobrescribirá el horario actual de esta semana.")) return;
      snapshotForUndo();
      state.horario = JSON.parse(JSON.stringify(state.plantillaSemana));
      ensureHorarioShape(); saveState(); render();
      showToast("Plantilla semanal aplicada", "ok", "zap");
    });
  }
  document.querySelectorAll("[data-restore-pub]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = Number(btn.dataset.restorePub);
      const h = (state.historialPublicaciones||[])[idx];
      if(!h) return;
      if(!window.confirm("¿Restaurar esta versión anterior del horario? Reemplazará el horario actual (puedes deshacer después).")) return;
      snapshotForUndo();
      try{ state.horario = JSON.parse(h.snapshot); }catch(e){ return; }
      ensureHorarioShape(); saveState(); render();
      showToast("Versión restaurada", "info", "undo");
    });
  });

  const notifBtn = document.getElementById("notifBtn");
  if(notifBtn){
    notifBtn.addEventListener("click", e=>{
      e.stopPropagation();
      notifOpen = !notifOpen;
      render();
    });
  }
  const notifPanel = document.getElementById("notifPanel");
  if(notifPanel) notifPanel.addEventListener("click", e=> e.stopPropagation());
  document.querySelectorAll("[data-goto-validacion]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ notifOpen=false; state.activeTab = "resumen"; render(); });
  });

  // Colaboradores
  const addColab = document.getElementById("addColab");
  if(addColab){
    addColab.addEventListener("click", ()=>{
      state.colaboradores.push({id:uid(), nombre:"Nuevo colaborador", puesto:"Cajero/Auxiliar", maxHoras: state.maxHorasSemana, sueldoHora:0});
      ensureHorarioShape(); saveState(); render();
    });
  }
  document.querySelectorAll("[data-del-colab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.colaboradores = state.colaboradores.filter(c=>c.id!==btn.dataset.delColab);
      ensureHorarioShape(); saveState(); render();
    });
  });
  document.querySelectorAll(".colab-nombre").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const c = state.colaboradores.find(x=>x.id===e.target.dataset.id);
      if(c){ c.nombre = e.target.value; saveState(); render(); }
    });
  });
  document.querySelectorAll(".colab-puesto").forEach(sel=>{
    sel.addEventListener("change", e=>{
      const c = state.colaboradores.find(x=>x.id===e.target.dataset.id);
      if(c){ c.puesto = e.target.value; saveState(); render(); }
    });
  });
  document.querySelectorAll(".colab-horas").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const c = state.colaboradores.find(x=>x.id===e.target.dataset.id);
      if(c){ c.maxHoras = Number(e.target.value)||state.maxHorasSemana; saveState(); render(); }
    });
  });
  document.querySelectorAll(".colab-sueldo").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const c = state.colaboradores.find(x=>x.id===e.target.dataset.id);
      if(c){ c.sueldoHora = Math.max(0, Number(e.target.value)||0); saveState(); render(); }
    });
  });

  // Turnos / plantillas
  const addTurno = document.getElementById("addTurno");
  if(addTurno){
    addTurno.addEventListener("click", ()=>{
      state.turnos.push({id:uid(), nombre:"Nueva plantilla", inicio:"09:00", fin:"17:00", minPersonal:2});
      saveState(); render();
    });
  }
  document.querySelectorAll("[data-del-turno]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      state.turnos = state.turnos.filter(t=>t.id!==btn.dataset.delTurno);
      saveState(); render();
    });
  });
  document.querySelectorAll(".turno-nombre").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const t = state.turnos.find(x=>x.id===e.target.dataset.id);
      if(t){ t.nombre = e.target.value; saveState(); render(); }
    });
  });
  document.querySelectorAll(".turno-inicio").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const t = state.turnos.find(x=>x.id===e.target.dataset.id);
      if(t){ t.inicio = e.target.value; saveState(); render(); }
    });
  });
  document.querySelectorAll(".turno-fin").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const t = state.turnos.find(x=>x.id===e.target.dataset.id);
      if(t){ t.fin = e.target.value; saveState(); render(); }
    });
  });
  document.querySelectorAll(".turno-min").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const t = state.turnos.find(x=>x.id===e.target.dataset.id);
      if(t){ t.minPersonal = Math.max(1, Number(e.target.value)||1); saveState(); render(); }
    });
  });
  const maxHorasDefault = document.getElementById("maxHorasDefault");
  if(maxHorasDefault){
    maxHorasDefault.addEventListener("change", e=>{ state.maxHorasSemana = Number(e.target.value)||48; saveState(); });
  }
  const op24h = document.getElementById("op24h");
  if(op24h){
    op24h.addEventListener("change", e=>{ state.operacion.is24h = e.target.checked; saveState(); render(); });
  }
  const opApertura = document.getElementById("opApertura");
  if(opApertura) opApertura.addEventListener("change", e=>{ state.operacion.apertura = e.target.value; saveState(); });
  const opCierre = document.getElementById("opCierre");
  if(opCierre) opCierre.addEventListener("change", e=>{ state.operacion.cierre = e.target.value; saveState(); });

  // Horario
  const autoBtn = document.getElementById("autoOrganizar");
  if(autoBtn) autoBtn.addEventListener("click", ()=>{
    snapshotForUndo(); autoOrganizar();
    showToast("Horario organizado automáticamente", "ok", "zap");
  });
  const publicarBtn = document.getElementById("publicarBtn");
  if(publicarBtn) publicarBtn.addEventListener("click", publicarHorario);
  const imprimirBtn = document.getElementById("imprimirHorario");
  if(imprimirBtn) imprimirBtn.addEventListener("click", ()=>{ window.print(); });
  const semanaLabelInput = document.getElementById("semanaLabelInput");
  if(semanaLabelInput) semanaLabelInput.addEventListener("change", e=>{ state.semanaLabel = e.target.value; saveState(); });
  const filtroColabInput = document.getElementById("filtroColabInput");
  if(filtroColabInput) filtroColabInput.addEventListener("input", e=>{ state.filtroColab = e.target.value; render(); });
  const deshacerBtn = document.getElementById("deshacerBtn");
  if(deshacerBtn) deshacerBtn.addEventListener("click", ()=>{
    deshacer();
    showToast("Cambio deshecho", "info", "undo");
  });
  const exportarCsvBtn = document.getElementById("exportarCsv");
  if(exportarCsvBtn) exportarCsvBtn.addEventListener("click", ()=>{
    exportarHorarioCSV();
    showToast("CSV exportado", "info", "download");
  });
  const clearBtn = document.getElementById("clearHorario");
  if(clearBtn) clearBtn.addEventListener("click", ()=>{
    if(!window.confirm("¿Vaciar todo el horario semanal? Esta acción se puede deshacer con el botón Deshacer.")) return;
    snapshotForUndo();
    for(let d=0; d<7; d++) state.horario[d] = {};
    saveState(); render();
    showToast("Horario vaciado", "warn", "eraser");
  });
  document.querySelectorAll("[data-day-copy]").forEach(sel=>{
    sel.addEventListener("change", e=>{
      const origen = Number(e.target.dataset.dayCopy);
      const destino = e.target.value;
      if(destino===""){ return; }
      const destinoNum = Number(destino);
      if(!window.confirm(`¿Copiar el horario de ${DIAS[origen]} sobre ${DIAS[destinoNum]} para todos los colaboradores? Se sobrescribirá lo que haya en ${DIAS[destinoNum]}.`)){
        e.target.value = ""; return;
      }
      snapshotForUndo();
      ensureHorarioShape();
      state.horario[destinoNum] = JSON.parse(JSON.stringify(state.horario[origen]));
      saveState(); render();
      showToast(`Copiado ${DIAS[origen]} → ${DIAS[destinoNum]}`, "ok", "check");
    });
  });

  function getEntry(d,cid){
    if(!state.horario[d]) state.horario[d] = {};
    return state.horario[d][cid];
  }
  document.querySelectorAll("[data-set-trabaja]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      const [d,cid] = btn.dataset.setTrabaja.split("|");
      state.horario[Number(d)][cid] = { estado:"trabaja", inicio:"09:00", fin:"17:00" };
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-set-descanso]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      snapshotForUndo();
      const [d,cid] = btn.dataset.setDescanso.split("|");
      state.horario[Number(d)][cid] = { estado:"descanso" };
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-quick]").forEach(sel=>{
    sel.addEventListener("change", e=>{
      if(!e.target.value) return;
      snapshotForUndo();
      const [d,cid] = e.target.dataset.quick.split("|");
      const t = state.turnos.find(x=>x.id===e.target.value);
      if(t){ state.horario[Number(d)][cid] = { estado:"trabaja", inicio:t.inicio, fin:t.fin }; saveState(); render(); }
    });
  });
  document.querySelectorAll(".cell-inicio").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const [d,cid] = e.target.dataset.key.split("|");
      const entry = getEntry(Number(d),cid);
      if(entry){ snapshotForUndo(); entry.inicio = e.target.value; saveState(); render(); }
    });
  });
  document.querySelectorAll(".cell-fin").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const [d,cid] = e.target.dataset.key.split("|");
      const entry = getEntry(Number(d),cid);
      if(entry){ snapshotForUndo(); entry.fin = e.target.value; saveState(); render(); }
    });
  });
}

loadState();
</script>
</body>
</html>
