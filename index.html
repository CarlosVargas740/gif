function vacModal(id, cid){
  const v=id?state.vacaciones.find(x=>x.id===id):null;
  const base=dsOf(ui.wk,0)>todayStr()?dsOf(ui.wk,0):todayStr();
  const st={ cid:v?v.cid:(cid||state.colabs[0].id), desde:v?v.desde:base, hasta:v?v.hasta:fmtDate(addDays(parseDate(base),6)), nota:v?v.nota||"":"" };
  const summary=()=>{
    if(!st.desde||!st.hasta) return "";
    if(st.hasta<st.desde) return `<div class="calc-info"><span class="pill err">${ic("alert")} La fecha final es anterior a la inicial</span></div>`;
    const n=daysBetween(st.desde,st.hasta)+1;
    const overlap=state.vacaciones.find(x=>x.id!==id && x.cid===st.cid && x.desde<=st.hasta && x.hasta>=st.desde);
    let shifts=0; for(let i=0;i<n && i<120;i++){ const ds=fmtDate(addDays(parseDate(st.desde),i)); const d=parseDate(ds); const g=getCell(wkOf(d),st.cid,(d.getDay()+6)%7); if(g&&g.t==="w") shifts++; }
    return `<div class="calc-info"><span class="pill vac">${ic("palm")} ${n} día${n===1?"":"s"}</span><span style="color:var(--muted);font-weight:600">Regresa el ${fmtLong(fmtDate(addDays(parseDate(st.hasta),1)))}</span></div>
      ${overlap?`<div class="calc-info" style="color:var(--warn)">${ic("alert").replace("<svg","<svg width='16' height='16'")} Se empalma con otro periodo de vacaciones registrado.</div>`:""}
      ${shifts?`<div class="calc-info" style="color:var(--info)">${ic("info").replace("<svg","<svg width='16' height='16'")} Tenía ${shifts} turno${shifts===1?"":"s"} asignado${shifts===1?"":"s"} en esas fechas; quedarán ocultos mientras dure la vacación.</div>`:""}`;
  };
  openModal({
    icon:"palm", iconStyle:"background:var(--vac-bg);color:var(--vac)", title:v?"Editar vacaciones":"Registrar vacaciones", sub:"Los días se bloquean en el horario automáticamente.",
    body:()=>`
      <div class="fld"><label>Colaborador</label><select class="inp" data-m-in="cid">${state.colabs.map(c=>`<option value="${c.id}" ${c.id===st.cid?"selected":""}>${esc(c.nombre)}</option>`).join("")}</select></div>
      <div class="row2"><div class="fld"><label>Desde</label><input type="date" class="inp" data-m-in="desde" value="${st.desde}"></div><div class="fld"><label>Hasta (incluido)</label><input type="date" class="inp" data-m-in="hasta" value="${st.hasta}"></div></div>
      <div class="quick-sel" style="margin:-6px 0 12px"><button data-m="dur" data-v="1">1 día</button><button data-m="dur" data-v="6">1 semana</button><button data-m="dur" data-v="13">2 semanas</button></div>
      <div class="fld"><label>Nota (opcional)</label><input class="inp" data-m-in="nota" value="${esc(st.nota)}" placeholder="Ej. Vacaciones de ley, permiso, incapacidad…" maxlength="80"></div>
      <div id="vacSum">${summary()}</div>`,
    foot:()=>`${v?`<button class="btn btn-t l" data-m="del" style="color:var(--err)">${ic("trash")} Eliminar</button>`:""}<button class="btn btn-g" data-m="close">Cancelar</button><button class="btn btn-p" data-m="save">${ic("check")} Guardar</button>`,
    onClick:(a,el)=>{
      if(a==="dur"){ if(!st.desde) return; st.hasta=fmtDate(addDays(parseDate(st.desde),+el.dataset.v)); M.redraw(); }
      if(a==="del"){ closeModal(); commit(()=>{ state.vacaciones=state.vacaciones.filter(x=>x.id!==id); }, {toast:"Vacaciones eliminadas", type:"warn", icon:"trash"}); }
      if(a==="save"){
        if(!st.desde||!st.hasta||st.hasta<st.desde){ toast("Revisa las fechas","warn"); return; }
        closeModal();
        commit(()=>{
          if(v) Object.assign(v,{cid:st.cid, desde:st.desde, hasta:st.hasta, nota:st.nota.trim()});
          else state.vacaciones.push({id:uid(), cid:st.cid, desde:st.desde, hasta:st.hasta, nota:st.nota.trim()});
        }, {toast:v?"Vacaciones actualizadas":"Vacaciones registradas", icon:"palm"});
      }
    },
    onInput:(el)=>{ const k=el.dataset.mIn; if(!k) return; st[k]=el.value; if(k!=="nota"){ const s=$("#vacSum"); if(s) s.innerHTML=summary(); } },
    onChange:(el)=>{ const k=el.dataset.mIn; if(k==="cid"){ st.cid=el.value; const s=$("#vacSum"); if(s) s.innerHTML=summary(); } }
  });
}

/* =========================================================
   MENÚS CONTEXTUALES
========================================================= */
function openMenu(anchor, items){
  closeMenu();
  const r=anchor.getBoundingClientRect();
  const root=$("#menuRoot");
  root.innerHTML=`<div class="menu">${items.map((it,i)=>it==="-"?"<hr>":`<button data-i="${i}" class="${it.danger?"danger":""}">${ic(it.icon)}${it.label}</button>`).join("")}</div>`;
  const m=root.firstChild;
  const w=m.offsetWidth, h=m.offsetHeight;
  let x=r.left, y=r.bottom+6;
  if(x+w>innerWidth-10) x=innerWidth-w-10;
  if(y+h>innerHeight-10){ y=r.top-h-6; m.style.transformOrigin="bottom left"; }
  m.style.left=Math.max(10,x)+"px"; m.style.top=Math.max(10,y)+"px";
  m.addEventListener("click", e=>{ const b=e.target.closest("button[data-i]"); if(!b) return; const it=items[+b.dataset.i]; closeMenu(); it.fn(); });
  setTimeout(()=>document.addEventListener("mousedown", outside), 0);
  function outside(e){ if(!m.contains(e.target)){ closeMenu(); } }
  root._off=()=>document.removeEventListener("mousedown", outside);
}
function closeMenu(){ const root=$("#menuRoot"); if(root._off) root._off(); root._off=null; root.innerHTML=""; }

async function copyPrevWeek(cid){
  const prev=shiftWk(ui.wk,-1);
  const ids=cid?[cid]:state.colabs.map(c=>c.id);
  let n=0; ids.forEach(id=>{ for(let d=0;d<7;d++){ const g=getCell(prev,id,d); if(g && !vacOn(id,dsOf(ui.wk,d))) n++; } });
  if(!n){ toast("La semana anterior no tiene turnos para copiar","info"); return; }
  const hasData=ids.some(id=>{ for(let d=0;d<7;d++) if(getCell(ui.wk,id,d)) return true; return false; });
  if(hasData && !await confirmDlg("Copiar semana anterior", `La semana actual ya tiene datos${cid?` para <b>${esc(colab(cid).nombre)}</b>`:""}. Se reemplazarán con los de la semana del ${fmtRange(prev)}.`, "Reemplazar")) return;
  commit(()=>{ ids.forEach(id=>{ for(let d=0;d<7;d++){ if(vacOn(id,dsOf(ui.wk,d))) continue; setCell(ui.wk,id,d,getCell(prev,id,d)); } }); }, {toast:`Semana anterior copiada · ${n} casillas`, icon:"history"});
}
function fillRest(){
  let n=0;
  const ops=[];
  state.colabs.forEach(c=>{ for(let d=0;d<7;d++){ if(eff(ui.wk,c.id,d).k===null){ ops.push([c.id,d]); n++; } } });
  if(!n){ toast("No hay casillas vacías","info"); return; }
  commit(()=>ops.forEach(([c,d])=>setCell(ui.wk,c,d,{t:"d"})), {toast:`${n} casillas marcadas como descanso`, icon:"coffee"});
}

      ${o.totals?`<div class="tt"><b>${fh(s.horas)}</b><span>${s.dias} días de trabajo · ${s.desc} descanso${s.desc===1?"":"s"}${s.vac?` · ${s.vac} vacaciones`:""}</span></div>`:""}</div>
    <table class="pit"><thead><tr><th>Día</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Tipo</th></tr></thead><tbody>${rows}</tbody></table>
    ${o.notes&&note?`<div class="pp-note"><b>Notas de la semana</b>${esc(note)}</div>`:""}
    ${o.signs?`<div class="pp-signs"><div>Firma del colaborador</div><div>Firma del líder de tienda</div></div>`:""}
    ${printFoot()}</div>`;
}
function doPrint(o){
  let html="", orient="landscape";
  if(o.scope==="team"){ for(let i=0;i<o.weeks;i++) html+=teamPage(shiftWk(o.wk,i),o); }
  else if(o.scope==="one"){ const c=colab(o.cid); if(c) html=onePage(o.wk,c,o); orient="portrait"; }
  else { html=state.colabs.map(c=>onePage(o.wk,c,o)).join(""); orient="portrait"; }
  const p=$("#print");
  p.innerHTML=`<style>@page{size:${orient==="landscape"?"letter landscape":"letter portrait"}; margin:9mm}${o.mono?".ps{background:transparent !important; border:1px solid #D3D8E3} .pt th{background:#fff !important; color:#0E1120 !important; border-bottom:2px solid #0E1120} .pt tr:nth-child(even) td{background:#fff !important} .pi-hero{background:#fff; border:1px solid #D3D8E3}":""}</style><div class="pp">${html}</div>`;
  const prevTitle=document.title;
  document.title=`Horario ${state.tienda} ${o.wk}`.replace(/[\\/:*?"<>|]/g,"");
  setTimeout(()=>{ window.print(); document.title=prevTitle; }, 80);
}

/* =========================================================
   EVENTOS GLOBALES
========================================================= */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el || el.closest("#modalRoot")) return;
  if(el.classList.contains("btn")) ripple(el,e);
  const a=el.dataset.act, v=el.dataset.v, cid=el.dataset.c;
  switch(a){
    case "tab": if(ui.tab!==v){ ui.tab=v; saveUi(); ui.anim="view"; ui.brush=null; render(); window.scrollTo({top:0,behavior:"smooth"}); } break;
    case "theme": state.theme=state.theme==="dark"?"light":"dark"; persist(); ui.anim=null; render(); break;
    case "undo": undo(); break;
    case "redo": redo(); break;
    case "wk": ui.wk=shiftWk(ui.wk,+v); ui.anim=+v<0?"wkL":"wkR"; render(); break;
    case "wkToday": { const t=wkOf(new Date()); ui.anim=t<ui.wk?"wkL":"wkR"; ui.wk=t; render(); break; }
    case "cell": onCell(cid,+el.dataset.d); break;
    case "brush": ui.brush = ui.brush&&ui.brush.id===v ? null : {id:v}; ui.anim=null; render(); if(ui.brush) toast("Pincel activo: haz clic en las casillas para aplicar","info",{icon:"brush"}); break;
    case "brushOff": ui.brush=null; ui.anim=null; render(); break;
    case "copyOpen": copyModal(cid||null); break;
    case "pdf": pdfModal(); break;
    case "presets": presetsModal(); break;
    case "weekMenu": weekMenu(el); break;
    case "rowMenu": rowMenu(el,cid); break;
    case "colabNew": colabModal(null); break;
    case "colabEdit": colabModal(cid); break;
    case "colabDel": colabDel(cid); break;
    case "colabMove": { const i=state.colabs.findIndex(c=>c.id===cid), j=i+(+v); if(j<0||j>=state.colabs.length) return; commit(()=>{ const t=state.colabs[i]; state.colabs[i]=state.colabs[j]; state.colabs[j]=t; }); break; }
    case "vacNew": if(state.colabs.length) vacModal(null,cid||null); break;
    case "vacEdit": vacModal(v); break;
    case "vacDel": { const vv=state.vacaciones.find(x=>x.id===v); const c=vv&&colab(vv.cid); commit(()=>{ state.vacaciones=state.vacaciones.filter(x=>x.id!==v); }, {toast:`Vacaciones de ${esc(c?c.nombre:"")} eliminadas`, type:"warn", icon:"trash"}); break; }
    case "tl": tlStart=fmtDate(addDays(parseDate(tlStart),+v)); ui.anim=null; render(); break;
    case "tlToday": tlStart=fmtDate(addDays(mondayOf(new Date()),-7)); ui.anim=null; render(); break;
    case "scrollAlerts": { const p=$("#alertsPanel"); if(p) p.scrollIntoView({behavior:"smooth", block:"center"}); break; }
  }
});
function onCell(cid,d){
  if(ui.brush && ui.tab==="horario"){
    if(vacOn(cid,dsOf(ui.wk,d))){ toast("Ese día está de vacaciones","info",{icon:"palm"}); return; }
    const b=ui.brush.id; let val;
    if(b==="__rest") val={t:"d"}; else if(b==="__clear") val=null;
    else { const p=state.presets.find(x=>x.id===b); if(!p) return; val={t:"w",i:p.i,f:p.f}; }
    commit(()=>setCell(ui.wk,cid,d,val));
    return;
  }
  cellEditor(cid,d);
}
function ripple(el,e){
  const r=el.getBoundingClientRect(), s=Math.max(r.width,r.height);
  const sp=document.createElement("span"); sp.className="ripple";
  sp.style.width=sp.style.height=s+"px"; sp.style.left=(e.clientX-r.left-s/2)+"px"; sp.style.top=(e.clientY-r.top-s/2)+"px";
  el.appendChild(sp); setTimeout(()=>sp.remove(),600);
}
let noteTimer=null, storeTimer=null;
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="qIn"){ ui.q=t.value; const pos=t.selectionStart; ui.anim=null; render(); const n=$("#qIn"); n.focus(); n.setSelectionRange(pos,pos); }
  if(t.id==="noteIn"){ clearTimeout(noteTimer); const wk=ui.wk, val=t.value; noteTimer=setTimeout(()=>{ if(val.trim()) state.notas[wk]=val; else delete state.notas[wk]; persist(); },500); }
  if(t.id==="storeIn"){ clearTimeout(storeTimer); const val=t.value; storeTimer=setTimeout(()=>{ state.tienda=val.trim()||"Mi tienda"; persist(); },500); }
});
document.addEventListener("keydown", e=>{
  const tag=(document.activeElement||{}).tagName;
  const typing=["INPUT","TEXTAREA","SELECT"].includes(tag);
  if(e.key==="Escape"){ if($("#menuRoot").innerHTML) closeMenu(); else if(M) closeModal(); else if(ui.brush){ ui.brush=null; ui.anim=null; render(); } return; }
  if(M) return;
  if((e.ctrlKey||e.metaKey) && !typing){
    if(e.key.toLowerCase()==="z" && !e.shiftKey){ e.preventDefault(); undo(); }
    else if(e.key.toLowerCase()==="y" || (e.key.toLowerCase()==="z" && e.shiftKey)){ e.preventDefault(); redo(); }
    else if(e.key.toLowerCase()==="p" && ui.tab==="horario"){ e.preventDefault(); pdfModal(); }
    return;
  }
  if(typing) return;
  if(ui.tab==="horario" && (e.key==="ArrowLeft"||e.key==="ArrowRight")){ const n=e.key==="ArrowLeft"?-1:1; ui.wk=shiftWk(ui.wk,n); ui.anim=n<0?"wkL":"wkR"; render(); }
});
addEventListener("resize", ()=>{ lastIndX=null; positionTabInd(); });
addEventListener("scroll", closeMenu, {passive:true});

   SINCRONIZACIÓN EN LA NUBE (Firebase Realtime Database)
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD2ovIbKOjRbEgxexd6lzsqrdz2yp44Qyg",
  authDomain: "horarios-oxxo.firebaseapp.com",
  projectId: "horarios-oxxo",
  storageBucket: "horarios-oxxo.firebasestorage.app",
  messagingSenderId: "679113818307",
  appId: "1:679113818307:web:68f492dc49f8eeeed62276",
  measurementId: "G-8TKC326KCF"
};
let remoteRef=null, pushTimer=null, suppress=0, pendingRemote=null;
const SYNC_TXT={local:"Solo local", busy:"Sincronizando", ok:"En la nube", err:"Sin conexión"};
function setSync(s){
  ui.sync=s; const el=$("#sync"); if(!el) return;
  el.className="sync "+(s==="local"?"":s);
  el.querySelector(".tx").textContent=SYNC_TXT[s]||"";
  el.title = s==="ok" ? "Cambios guardados y sincronizados entre dispositivos" : s==="err" ? "Sin conexión a la nube: los cambios se guardan en este equipo" : s==="busy" ? "Guardando en la nube…" : "Guardado solo en este dispositivo";
}
function initSync(){
  if(!window.firebase || !firebaseConfig.apiKey){ setSync("local"); return; }
  try{
    firebase.initializeApp(firebaseConfig);
    const db=firebase.database();
    remoteRef=db.ref(KEY);
    setSync("busy");
    remoteRef.on("value", snap=>{
      const val=snap.val();
      if(!val){
        // primera vez con v4: intentar migrar los datos de la versión anterior si aquí no hay nada
        if(!state.colabs.length){
          db.ref(OLD_KEY).once("value").then(o=>{
            const old=o.val();
            if(old && arr(old.colaboradores).length && !state.colabs.length){ state=normalize(migrateV3(old)); persistLocal(); ui.anim="view"; render(); toast("Datos anteriores importados","ok",{icon:"sparkle"}); }
            pushRemote(true);
          }).catch(()=>pushRemote(true));
        } else pushRemote(true);
        return;
      }
      if(suppress>0){ suppress--; setSync("ok"); return; }
      if((val.updatedAt||0) < (state.updatedAt||0)){ pushRemote(true); return; }
      applyRemote(val);
      setSync("ok");
    }, err=>{ console.error(err); setSync("err"); });
  }catch(e){ console.error(e); setSync("err"); }
}
function persistLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function applyRemote(val){
  const a=document.activeElement;
  if(M || (a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName))){ pendingRemote=val; return; }
  state=normalize(val); persistLocal(); ui.anim=null; render();
}
setInterval(()=>{ if(pendingRemote && !M){ const a=document.activeElement; if(!(a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName))){ const p=pendingRemote; pendingRemote=null; applyRemote(p); } } }, 1500);
function pushRemote(now){
  if(!remoteRef) return;
  clearTimeout(pushTimer);
  const go=()=>{ suppress++; setSync("busy"); remoteRef.set(clone(state)).then(()=>setSync("ok")).catch(e=>{ suppress=Math.max(0,suppress-1); console.error(e); setSync("err"); }); };
  if(now) go(); else pushTimer=setTimeout(go,600);
}

/* =========================================================
   ARRANQUE
========================================================= */
(function boot(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) state=normalize(JSON.parse(raw));
    else{
      const old=localStorage.getItem(OLD_KEY);
      if(old){ state=normalize(migrateV3(JSON.parse(old))); persistLocal(); setTimeout(()=>toast("Tus datos anteriores se importaron","ok",{icon:"sparkle"}),600); }
    }
  }catch(e){ console.error(e); state=defaultState(); }
  ui.anim="view";
  render();
  initSync();
})();
</script>
